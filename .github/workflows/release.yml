name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.4.0.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        id: version
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid extension version: $VERSION"
            echo "Use four numeric components, for example 2.4.0.3"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          node -e 'const fs=require("fs"); const version=process.argv[1]; const packageJson=JSON.parse(fs.readFileSync("package.json", "utf8")); packageJson.version=version; fs.writeFileSync("package.json", JSON.stringify(packageJson, null, 2) + "\n"); const manifest=JSON.parse(fs.readFileSync("manifest.json", "utf8")); manifest.version=version; fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2) + "\n");' "$VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Build release archives
        run: npm run build:release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Just Lyrics v${{ steps.version.outputs.version }}
          files: dist/Just-Lyrics-*.zip
          generate_release_notes: true
